name: Update Total Stars

on:
  schedule:
    # Runs daily at midnight UTC
    - cron: '0 0 * * *'
  workflow_dispatch: # Allows manual trigger

permissions:
  contents: write

jobs:
  update-stars:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3
        
      - name: Fetch star counts and update README
        run: |
          # Fetch star counts from GitHub API
          STRATEQUEUE_STARS=$(curl -s "https://api.github.com/repos/StrateQueue/StrateQueue" | jq '.stargazers_count')
          MADRASLY_STARS=$(curl -s "https://api.github.com/repos/madrasly/madrasly" | jq '.stargazers_count')
          PMXT_STARS=$(curl -s "https://api.github.com/repos/pmxt-dev/pmxt" | jq '.stargazers_count')
          PMXT_ARB_BOT_STARS=$(curl -s "https://api.github.com/repos/realfishsam/prediction-market-arbitrage-bot" | jq '.stargazers_count')
          
          # Calculate total
          TOTAL_STARS=$((STRATEQUEUE_STARS + MADRASLY_STARS + PMXT_STARS + PMXT_ARB_BOT_STARS))
          
          # Update README.md
          # This replaces content between the comment markers
          sed -i "/<!-- STAR_COUNT_START -->/,/<!-- STAR_COUNT_END -->/{
            /<!-- STAR_COUNT_START -->/!{
              /<!-- STAR_COUNT_END -->/!d
            }
          }" README.md
          
          sed -i "/<!-- STAR_COUNT_START -->/a <div align=\"center\"><b>Total Stars Across Projects:</b> ${TOTAL_STARS} ⭐</div>" README.md
          
      - name: Commit changes
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add README.md
          git diff --quiet && git diff --staged --quiet || git commit -m "Update total star count"
          
      - name: Push changes
        run: git push
